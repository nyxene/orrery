name: Bug
description: Something errors, fails, or does not resolve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form — see
        [SECURITY.md](https://github.com/nyxene/orrery/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field in `.claude-plugin/plugin.json`.
      placeholder: "0.10.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: What was involved
      options:
        - A skill
        - A hook or guard
        - An agent
        - A rule
        - Install / marketplace
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or action, and the output. Paste it rather than describing it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15.5, Ubuntu 24.04, ..."
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: "`jq` is on my PATH"
          required: true
        - label: I have taken out anything private — paths, credentials, customer data
          required: true
