name: gates

# The same gates .githooks/pre-commit runs, run again where nobody can forget
# to enable them: core.hooksPath is local config, so a fresh clone has the hook
# on disk and switched off, which looks exactly like having it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every hook in this repository shells out to jq. Without it they fail
      # closed, which is correct behaviour and a useless CI signal.
      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          jq --version

      - name: Guard corpus
        run: ./hooks/bash-guard.test.sh

      # The Agent guard's whole pass — corpus, probes and mutants — costs about
      # two seconds against the Bash guard's minutes, so it needs no trigger.
      - name: Agent guard corpus and mutation pass
        run: ./hooks/agent-guard.test.sh --mutate

      # The process gate and its escape, same cost and the same lack of a
      # trigger. A gate whose waiver stops recording is worse than no gate.
      - name: Process guard corpus and mutation pass
        run: ./hooks/process-guard.test.sh --mutate

      - name: Waiver suite
        run: ./hooks/waiver.test.sh

      # The mutation pass proves the corpus still pins the guard rather than
      # merely running beside it. It takes minutes, so it runs only when the
      # thing it pins is in the diff — same rule as the pre-commit hook.
      - name: Did the guard change
        id: guard
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          if git diff --name-only "$base" HEAD | grep -qE '^hooks/(bash-guard\.sh|bash-guard\.test\.sh|cases\.tsv|guard-test-lib\.sh)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard mutation pass
        if: steps.guard.outputs.changed == 'true'
        run: ./hooks/bash-guard.test.sh --mutate

      - name: Call log
        run: ./hooks/call-log.test.sh

      # The three hooks that emit rather than decide. A loader that stops
      # emitting looks exactly like a session with nothing to load, which is why
      # these assert on what reaches the harness rather than on an exit code.
      - name: Canon loader
        run: ./hooks/canon-loader.test.sh

      - name: Orrery config
        run: ./hooks/orrery-config.test.sh

      - name: Rules loader
        run: ./hooks/rules-loader.test.sh

      - name: Handoff prompt
        run: ./hooks/handoff-prompt.test.sh

      # The deny-list reporter's failure is silence too: a detector that stops
      # noticing drift looks identical to a project with nothing missing.
      - name: Permissions check
        run: ./hooks/permissions-check.test.sh

      - name: Library claims
        run: ./skills/sharpen/check-claims.sh

      # Not a gate: the loaders and guards are what every session executes, and
      # a syntax error in one fails closed at the worst possible moment.
      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || status=1
          done < <(find hooks skills .githooks -name '*.sh' -o -path '.githooks/*' -type f)
          exit $status
